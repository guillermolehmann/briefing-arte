name: Generar episodio
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "guion.txt"
      - "guion_en.txt"
      - "titulos.json"
      - "guion_curso.txt"
      - "guion_curso_en.txt"
      - "titulos_curso.json"
      - "curso/apunte/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # La rutina diaria a veces pushea a una rama claude/** en vez de main
      # (lo decide el entorno de claude.ai/code, no el PROMPT). Si la corrida
      # llega desde una rama, la fusionamos a main aca mismo y seguimos
      # trabajando sobre main, para que el episodio se publique solo.
      - name: Llevar el trabajo de la rutina a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Ya estamos en main"
            exit 0
          fi
          echo "Corrida desde la rama $GITHUB_REF_NAME"
          git fetch origin main
          git checkout -B main origin/main
          # NO se fusiona la rama entera. Se traen SOLO los archivos que la
          # rutina tiene permitido escribir. Antes se hacía git merge y el 15
          # de agosto de 2026 eso falló: mientras la rutina trabajaba en su
          # rama, main cambió por otro lado (guías, portadas, examen), las dos
          # manos tocaron docs/ y git se plantó con un conflicto. docs/ lo
          # regenera Actions en cada corrida, así que nunca debe venir de la
          # rama. Con esta forma el choque es imposible.
          MIOS="guion.txt guion_en.txt guion_curso.txt guion_curso_en.txt
                titulos.json titulos_curso.json curso memoria"
          for p in $MIOS; do
            if git cat-file -e "$GITHUB_SHA:$p" 2>/dev/null; then
              git checkout "$GITHUB_SHA" -- "$p" && echo "  traigo $p"
            fi
          done
          git add -A $MIOS 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "La rama no traía nada nuevo de la rutina"
          else
            git commit -m "Traigo el material de $GITHUB_REF_NAME (rutina diaria)"
            git push origin HEAD:main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install --quiet edge-tts mutagen markdown weasyprint

      - name: Generar episodios (con reintentos)
        run: |
          for i in 1 2 3; do
            if python3 generar_episodio.py; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "Fallaron los 3 intentos de TTS"
              exit 1
            fi
            echo "Intento $i falló, reintento en 30s..."
            sleep 30
          done

      - name: Renderizar apuntes en PDF
        continue-on-error: true
        run: python3 render_apunte.py

      # Las guías de estudio en HTML, con la identidad Marco. Salen del mismo
      # apunte que el PDF, así que no cuestan nada aparte. Si esto falla, el
      # PDF y el mail siguen saliendo igual.
      - name: Armar las guías de estudio
        continue-on-error: true
        run: python3 construir_guias.py

      - name: Publicar (commit y push de docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # El 11 de septiembre de 2026 esta corrida genero los dos episodios del
          # dia y despues perdio el push: mientras la voz trabajaba sus noventa
          # segundos, main se movio por otro lado y git rechazo el envio por no
          # ser fast-forward. Se tiro a la basura un dia entero de audio ya
          # generado, y como al dia siguiente la rutina pisa los guiones, ese
          # episodio no se recupera nunca.
          # Ahora el commit se apoya siempre en lo ultimo que haya en main. docs/
          # lo regenera Actions completo en cada corrida, asi que pisar lo que
          # haya ahi es lo correcto y no se pierde trabajo de nadie.
          for i in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add docs/
            if git diff --cached --quiet; then
              echo "Nada nuevo que publicar"
              exit 0
            fi
            git commit -m "Episodios del dia (generados por Actions)"
            if git push origin HEAD:main; then
              echo "Publicado"
              exit 0
            fi
            echo "El push fue rechazado (intento $i de 3), main se movio. Reintento."
            sleep 5
          done
          echo "No pude publicar despues de 3 intentos"
          exit 1

      - name: Preparar mail del apunte
        id: mailprep
        if: env.MAIL_USERNAME != ''
        run: |
          HOY=$(date +%F)
          # Si hoy salio una clase de la cola de re-emision, el mail tiene que
          # llevar el PDF y la guia de ESA clase, no los de hoy, que no existen.
          # generar_episodio.py deja la fecha original en reemision_hoy.txt.
          CLASE="$HOY"
          if [ -s reemision_hoy.txt ]; then
            CLASE=$(cat reemision_hoy.txt)
            echo "Re-emision: hoy sale la clase del $CLASE"
          fi
          PDF="docs/curso/pdf/$CLASE.pdf"
          if [ ! -f "$PDF" ]; then echo "enviar=no" >> $GITHUB_OUTPUT; echo "sin PDF de hoy"; exit 0; fi
          # Una clase se manda UNA sola vez. Sin esto, cada corrida repetida del
          # dia (un reintento por una falla, un boton apretado dos veces) le
          # llegaba a Virginia como un mail mas con el mismo apunte adjunto.
          if [ -f "docs/curso/enviados/$CLASE.ok" ]; then
            echo "enviar=no" >> $GITHUB_OUTPUT
            echo "El apunte del $CLASE ya se habia mandado, no lo repito"
            exit 0
          fi
          echo "clase=$CLASE" >> $GITHUB_OUTPUT
          TITULO=$(python3 -c "import json;print(json.load(open('titulos_curso.json')).get('$CLASE',{}).get('titulo',''))")
          DEST=$(python3 -c "import json;print(json.load(open('config_curso.json')).get('email_apunte',''))")
          if [ -z "$TITULO" ] || [ -z "$DEST" ] || [ "$DEST" = "PENDIENTE" ]; then echo "enviar=no" >> $GITHUB_OUTPUT; exit 0; fi
          echo "enviar=si" >> $GITHUB_OUTPUT
          echo "titulo=$TITULO" >> $GITHUB_OUTPUT
          echo "dest=$DEST" >> $GITHUB_OUTPUT
          echo "pdf=$PDF" >> $GITHUB_OUTPUT
          echo "url=https://guillermolehmann.github.io/briefing-arte/curso/pdf/$CLASE.pdf" >> $GITHUB_OUTPUT
          echo "guia=https://guillermolehmann.github.io/briefing-arte/curso/guia/$CLASE.html" >> $GITHUB_OUTPUT

      - name: Enviar apunte por mail
        if: steps.mailprep.outputs.enviar == 'si'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.mailprep.outputs.titulo }}
          to: ${{ steps.mailprep.outputs.dest }}
          from: Arte a la Mañana <${{ secrets.MAIL_USERNAME }}>
          html_body: '<p>Buen día. La clase de hoy es <strong>${{ steps.mailprep.outputs.titulo }}</strong>.</p><p><a href="${{ steps.mailprep.outputs.guia }}"><strong>Abrir la guía de estudio</strong></a>, con el audio, el texto y las fuentes en una sola página, hecha para el teléfono.</p><p>Va también el apunte en PDF adjunto, y <a href="${{ steps.mailprep.outputs.url }}">acá para abrirlo en el navegador</a>.</p><p><a href="https://guillermolehmann.github.io/briefing-arte/curso/guia/">Todas las guías del curso</a></p><p>— Arte a la Mañana</p>'
          attachments: ${{ steps.mailprep.outputs.pdf }}

      # ---- El mismo circuito, para el apunte en inglés del día ----
      # Va como mail aparte, con su propio PDF adjunto, por decisión de
      # Guillermo del 10 de agosto de 2026. Si algún día no hay versión en
      # inglés, este paso se saltea solo y el mail en español sale igual.
      - name: Preparar mail del apunte en inglés
        id: mailprep_en
        if: env.MAIL_USERNAME != ''
        run: |
          HOY=$(date +%F)
          CLASE="$HOY"
          if [ -s reemision_hoy.txt ]; then CLASE=$(cat reemision_hoy.txt); fi
          PDF="docs/curso/pdf/$CLASE-en.pdf"
          if [ ! -f "$PDF" ]; then echo "enviar=no" >> $GITHUB_OUTPUT; echo "sin PDF en inglés de hoy"; exit 0; fi
          if [ -f "docs/curso/enviados/$CLASE-en.ok" ]; then
            echo "enviar=no" >> $GITHUB_OUTPUT
            echo "El apunte en inglés del $CLASE ya se habia mandado, no lo repito"
            exit 0
          fi
          echo "clase=$CLASE" >> $GITHUB_OUTPUT
          TITULO=$(python3 -c "import json;print(json.load(open('titulos_curso.json')).get('$CLASE-en',{}).get('titulo',''))")
          DEST=$(python3 -c "import json;print(json.load(open('config_curso.json')).get('email_apunte',''))")
          if [ -z "$TITULO" ] || [ -z "$DEST" ] || [ "$DEST" = "PENDIENTE" ]; then echo "enviar=no" >> $GITHUB_OUTPUT; exit 0; fi
          echo "enviar=si" >> $GITHUB_OUTPUT
          echo "titulo=$TITULO" >> $GITHUB_OUTPUT
          echo "dest=$DEST" >> $GITHUB_OUTPUT
          echo "pdf=$PDF" >> $GITHUB_OUTPUT
          echo "url=https://guillermolehmann.github.io/briefing-arte/curso/pdf/$CLASE-en.pdf" >> $GITHUB_OUTPUT
          echo "guia=https://guillermolehmann.github.io/briefing-arte/curso/guia/$CLASE-en.html" >> $GITHUB_OUTPUT

      - name: Enviar apunte en inglés por mail
        if: steps.mailprep_en.outputs.enviar == 'si'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "(EN) ${{ steps.mailprep_en.outputs.titulo }}"
          to: ${{ steps.mailprep_en.outputs.dest }}
          from: Arte a la Mañana <${{ secrets.MAIL_USERNAME }}>
          html_body: '<p>Good morning. Today''s class is <strong>${{ steps.mailprep_en.outputs.titulo }}</strong>.</p><p><a href="${{ steps.mailprep_en.outputs.guia }}"><strong>Open the study guide</strong></a>, with the audio, the text and the sources on a single page, made for the phone.</p><p>The PDF is attached as well, and <a href="${{ steps.mailprep_en.outputs.url }}">here to open it in the browser</a>.</p><p><a href="https://guillermolehmann.github.io/briefing-arte/curso/guia/">All the study guides</a></p><p>— Arte a la Mañana</p>'
          attachments: ${{ steps.mailprep_en.outputs.pdf }}

      # La marca de lo ya enviado vive en el repo, porque cada corrida arranca
      # de cero y no se acuerda de nada. Se anota DESPUES de mandar y se sube
      # aparte, porque la publicacion de docs/ ya paso cuando llega este paso.
      - name: Anotar los apuntes ya enviados
        if: steps.mailprep.outputs.enviar == 'si' || steps.mailprep_en.outputs.enviar == 'si'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/curso/enviados
          if [ "${{ steps.mailprep.outputs.enviar }}" = "si" ]; then
            touch "docs/curso/enviados/${{ steps.mailprep.outputs.clase }}.ok"
          fi
          if [ "${{ steps.mailprep_en.outputs.enviar }}" = "si" ]; then
            touch "docs/curso/enviados/${{ steps.mailprep_en.outputs.clase }}-en.ok"
          fi
          for i in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add docs/curso/enviados
            if git diff --cached --quiet; then
              echo "Ya estaba anotado"
              exit 0
            fi
            git commit -m "Anoto los apuntes mandados por mail"
            if git push origin HEAD:main; then
              echo "Anotado"
              exit 0
            fi
            echo "Push rechazado (intento $i de 3), reintento"
            sleep 5
          done
