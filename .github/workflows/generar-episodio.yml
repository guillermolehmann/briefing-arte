name: Generar episodio
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "guion.txt"
      - "guion_en.txt"
      - "titulos.json"
      - "guion_curso.txt"
      - "guion_curso_en.txt"
      - "titulos_curso.json"
      - "curso/apunte/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # La rutina diaria a veces pushea a una rama claude/** en vez de main
      # (lo decide el entorno de claude.ai/code, no el PROMPT). Si la corrida
      # llega desde una rama, la fusionamos a main aca mismo y seguimos
      # trabajando sobre main, para que el episodio se publique solo.
      - name: Llevar el trabajo de la rutina a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Ya estamos en main"
            exit 0
          fi
          echo "Corrida desde la rama $GITHUB_REF_NAME"
          git fetch origin main
          git checkout -B main origin/main
          # NO se fusiona la rama entera. Se traen SOLO los archivos que la
          # rutina tiene permitido escribir. Antes se hacía git merge y el 15
          # de agosto de 2026 eso falló: mientras la rutina trabajaba en su
          # rama, main cambió por otro lado (guías, portadas, examen), las dos
          # manos tocaron docs/ y git se plantó con un conflicto. docs/ lo
          # regenera Actions en cada corrida, así que nunca debe venir de la
          # rama. Con esta forma el choque es imposible.
          MIOS="guion.txt guion_en.txt guion_curso.txt guion_curso_en.txt
                titulos.json titulos_curso.json curso memoria"
          for p in $MIOS; do
            if git cat-file -e "$GITHUB_SHA:$p" 2>/dev/null; then
              git checkout "$GITHUB_SHA" -- "$p" && echo "  traigo $p"
            fi
          done
          git add -A $MIOS 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "La rama no traía nada nuevo de la rutina"
          else
            git commit -m "Traigo el material de $GITHUB_REF_NAME (rutina diaria)"
            git push origin HEAD:main
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install --quiet edge-tts mutagen markdown weasyprint

      - name: Generar episodios (con reintentos)
        run: |
          for i in 1 2 3; do
            if python3 generar_episodio.py; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "Fallaron los 3 intentos de TTS"
              exit 1
            fi
            echo "Intento $i falló, reintento en 30s..."
            sleep 30
          done

      - name: Renderizar apuntes en PDF
        continue-on-error: true
        run: python3 render_apunte.py

      # Las guías de estudio en HTML, con la identidad Marco. Salen del mismo
      # apunte que el PDF, así que no cuestan nada aparte. Si esto falla, el
      # PDF y el mail siguen saliendo igual.
      - name: Armar las guías de estudio
        continue-on-error: true
        run: python3 construir_guias.py

      - name: Publicar (commit y push de docs/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "Nada nuevo que publicar" || { git commit -m "Episodios del dia (generados por Actions)"; git push origin HEAD:main; }

      - name: Preparar mail del apunte
        id: mailprep
        if: env.MAIL_USERNAME != ''
        run: |
          HOY=$(date +%F)
          PDF="docs/curso/pdf/$HOY.pdf"
          if [ ! -f "$PDF" ]; then echo "enviar=no" >> $GITHUB_OUTPUT; echo "sin PDF de hoy"; exit 0; fi
          TITULO=$(python3 -c "import json;print(json.load(open('titulos_curso.json')).get('$HOY',{}).get('titulo',''))")
          DEST=$(python3 -c "import json;print(json.load(open('config_curso.json')).get('email_apunte',''))")
          if [ -z "$TITULO" ] || [ -z "$DEST" ] || [ "$DEST" = "PENDIENTE" ]; then echo "enviar=no" >> $GITHUB_OUTPUT; exit 0; fi
          echo "enviar=si" >> $GITHUB_OUTPUT
          echo "titulo=$TITULO" >> $GITHUB_OUTPUT
          echo "dest=$DEST" >> $GITHUB_OUTPUT
          echo "pdf=$PDF" >> $GITHUB_OUTPUT
          echo "url=https://guillermolehmann.github.io/briefing-arte/curso/pdf/$HOY.pdf" >> $GITHUB_OUTPUT
          echo "guia=https://guillermolehmann.github.io/briefing-arte/curso/guia/$HOY.html" >> $GITHUB_OUTPUT

      - name: Enviar apunte por mail
        if: steps.mailprep.outputs.enviar == 'si'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.mailprep.outputs.titulo }}
          to: ${{ steps.mailprep.outputs.dest }}
          from: Arte a la Mañana <${{ secrets.MAIL_USERNAME }}>
          html_body: '<p>Buen día. La clase de hoy es <strong>${{ steps.mailprep.outputs.titulo }}</strong>.</p><p><a href="${{ steps.mailprep.outputs.guia }}"><strong>Abrir la guía de estudio</strong></a>, con el audio, el texto y las fuentes en una sola página, hecha para el teléfono.</p><p>Va también el apunte en PDF adjunto, y <a href="${{ steps.mailprep.outputs.url }}">acá para abrirlo en el navegador</a>.</p><p><a href="https://guillermolehmann.github.io/briefing-arte/curso/guia/">Todas las guías del curso</a></p><p>— Arte a la Mañana</p>'
          attachments: ${{ steps.mailprep.outputs.pdf }}

      # ---- El mismo circuito, para el apunte en inglés del día ----
      # Va como mail aparte, con su propio PDF adjunto, por decisión de
      # Guillermo del 10 de agosto de 2026. Si algún día no hay versión en
      # inglés, este paso se saltea solo y el mail en español sale igual.
      - name: Preparar mail del apunte en inglés
        id: mailprep_en
        if: env.MAIL_USERNAME != ''
        run: |
          HOY=$(date +%F)
          PDF="docs/curso/pdf/$HOY-en.pdf"
          if [ ! -f "$PDF" ]; then echo "enviar=no" >> $GITHUB_OUTPUT; echo "sin PDF en inglés de hoy"; exit 0; fi
          TITULO=$(python3 -c "import json;print(json.load(open('titulos_curso.json')).get('$HOY-en',{}).get('titulo',''))")
          DEST=$(python3 -c "import json;print(json.load(open('config_curso.json')).get('email_apunte',''))")
          if [ -z "$TITULO" ] || [ -z "$DEST" ] || [ "$DEST" = "PENDIENTE" ]; then echo "enviar=no" >> $GITHUB_OUTPUT; exit 0; fi
          echo "enviar=si" >> $GITHUB_OUTPUT
          echo "titulo=$TITULO" >> $GITHUB_OUTPUT
          echo "dest=$DEST" >> $GITHUB_OUTPUT
          echo "pdf=$PDF" >> $GITHUB_OUTPUT
          echo "url=https://guillermolehmann.github.io/briefing-arte/curso/pdf/$HOY-en.pdf" >> $GITHUB_OUTPUT
          echo "guia=https://guillermolehmann.github.io/briefing-arte/curso/guia/$HOY-en.html" >> $GITHUB_OUTPUT

      - name: Enviar apunte en inglés por mail
        if: steps.mailprep_en.outputs.enviar == 'si'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "(EN) ${{ steps.mailprep_en.outputs.titulo }}"
          to: ${{ steps.mailprep_en.outputs.dest }}
          from: Arte a la Mañana <${{ secrets.MAIL_USERNAME }}>
          html_body: '<p>Good morning. Today''s class is <strong>${{ steps.mailprep_en.outputs.titulo }}</strong>.</p><p><a href="${{ steps.mailprep_en.outputs.guia }}"><strong>Open the study guide</strong></a>, with the audio, the text and the sources on a single page, made for the phone.</p><p>The PDF is attached as well, and <a href="${{ steps.mailprep_en.outputs.url }}">here to open it in the browser</a>.</p><p><a href="https://guillermolehmann.github.io/briefing-arte/curso/guia/">All the study guides</a></p><p>— Arte a la Mañana</p>'
          attachments: ${{ steps.mailprep_en.outputs.pdf }}
